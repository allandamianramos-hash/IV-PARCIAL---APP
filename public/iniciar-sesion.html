<body class="auth-page auth-login">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <main id="contenido" class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title"><a class="auth-brand" href="index.html" aria-label="Rumbo, volver al inicio">rumbo<span aria-hidden="true">↗</span></a><div class="auth-heading"><h1 id="auth-title">Iniciar sesión</h1><p>Qué bueno verte de nuevo.</p></div>
      <form id="auth-form" data-mode="login">
        <div class="auth-field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" placeholder="nombre@ejemplo.com" autocomplete="username" maxlength="254" required></div>
        <div class="auth-field"><label for="password">Contraseña</label><div class="auth-password"><input id="password" name="password" type="password" placeholder="Ej.: Viaje2026!" autocomplete="current-password" maxlength="128" required><button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Mostrar</button></div></div>
        <button class="button button-primary" type="submit">Iniciar sesión</button>
        <p id="auth-feedback" role="status" aria-live="polite" tabindex="-1"></p>
      </form><p class="auth-recovery-link"><a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a></p>
<section class="auth-social" aria-labelledby="social-title"><p id="social-title" class="auth-divider"><span>O continúa con</span></p><div class="auth-social-options"><div class="auth-google"><div id="google-signin" aria-label="Continuar con Google" translate="no"></div><p id="google-feedback" class="auth-social-note" role="status" aria-live="polite"></p></div><div class="auth-microsoft"><button id="microsoft-signin" type="button" class="auth-provider" aria-label="Continuar con Microsoft" title="Continuar con Microsoft" aria-describedby="microsoft-feedback" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f25022" d="M2 2h9.5v9.5H2z"/><path fill="#7fba00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00a4ef" d="M2 12.5h9.5V22H2z"/><path fill="#ffb900" d="M12.5 12.5H22V22h-9.5z"/></svg></button><p id="microsoft-feedback" class="auth-social-note" role="status" aria-live="polite"></p></div></div><p id="social-note" class="auth-social-note">Usarás también tu contraseña de Rumbo.</p></section>
      <p class="auth-switch">¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
      <noscript>Activa JavaScript para iniciar sesión.</noscript>
    </section>
  </main>
  <footer class="auth-footer"><div class="auth-footer-links"><a href="index.html">Inicio</a><a href="servicios.html?seccion=privacidad">Privacidad</a></div><div class="auth-locale"></div></footer>
