      <div class="rv-search-bottom"><p id="flight-form-notice" role="status">Vuelos de ida · ajusta fechas y pasajeros.</p><button class="button button-primary" type="submit">Actualizar búsqueda ↗</button></div>
    </form>
    <div class="rv-flow-layout"><section aria-labelledby="flight-result-title"><div class="rv-results-heading"><div><h2 id="flight-result-title"></h2><p id="flight-results-meta" role="status"></p></div><label class="rv-sort">Ordenar<select id="flight-sort"><option value="recommended">Recomendados</option><option value="price-low">Menor precio</option><option value="time">Salida más temprana</option></select></label></div>
      <p id="flight-transfer" class="rv-notice" hidden></p><div id="flight-list" class="rv-options-list"></div>
    </section><aside id="resumen-viaje" class="rv-trip-summary" aria-label="Resumen de tu selección"></aside></div>
  </template>

  <!-- HOTELES -->
  <template id="rv-vista-hoteles">
    <section class="booking-intro section-hero" aria-labelledby="page-title"><div><h1 id="page-title">Hospedaje</h1><p>Compara habitaciones y consulta el total según noches y huéspedes.</p></div><figure><img src="imagenes-viajes/hoteles/hotel-piscina.jpg" alt="Piscina y terrazas de un hotel" width="2560" height="1707" fetchpriority="high"></figure></section>
    <form id="hotel-search" class="rv-search-panel rv-hotel-search">
      <div class="rv-field"><label for="hotel-destination">Destino</label><select id="hotel-destination" name="destination" required></select></div>
      <div class="rv-field"><label for="hotel-date">Entrada al hotel</label><input id="hotel-date" name="checkIn" type="date" required></div>
      <div class="rv-field"><label for="hotel-nights">Noches</label><input id="hotel-nights" name="nights" type="number" min="1" max="30" step="1" placeholder="Ej.: 3" required></div>
      <div class="rv-field"><label for="hotel-travelers">Huéspedes</label><input id="hotel-travelers" name="travelers" type="number" min="1" max="12" step="1" placeholder="Ej.: 2" required></div>
      <div class="rv-field"><label for="hotel-rooms">Habitaciones</label><input id="hotel-rooms" name="rooms" type="number" min="1" max="6" step="1" placeholder="Ej.: 1" required></div>
      <div class="rv-search-bottom"><p id="hotel-form-notice" role="status"></p><button class="button button-primary" type="submit">Actualizar estancia ↗</button></div>
    </form>
    <div class="rv-flow-layout"><section aria-labelledby="hotel-result-title">
      <div class="rv-results-heading"><div><h2 id="hotel-result-title"></h2><p id="hotel-results-meta" role="status"></p></div></div>
      <form id="hotel-filters" class="rv-hotel-filters">
        <div class="rv-field"><label for="hotel-stars">Categoría</label><select id="hotel-stars"><option value="all">Todas</option><option value="4">4 estrellas o más</option><option value="5">5 estrellas</option></select></div>
        <div class="rv-field"><label for="hotel-max-price">Máximo / noche / hab.</label><input id="hotel-max-price" type="number" min="0" step="1" placeholder="Sin límite"></div>
        <div class="rv-field"><label for="hotel-sort">Ordenar</label><select id="hotel-sort"><option value="recommended">Recomendados</option><option value="price-low">Menor precio</option><option value="stars">Más estrellas</option></select></div>
        <label class="rv-checkbox"><input id="hotel-breakfast" type="checkbox"> Con desayuno</label>
        <button type="reset" class="rv-link-button">Limpiar</button>
      </form>
      <div id="hotel-list" class="rv-options-list"></div>
      <div id="hotel-empty" class="rv-empty" hidden><h3>No hay hoteles con esos filtros.</h3><p>Amplía el precio o cambia la categoría.</p><button id="hotel-reset-empty" type="button" class="button button-primary">Limpiar filtros</button></div>
    </section><aside id="resumen-viaje" class="rv-trip-summary" aria-label="Resumen de tu selección"></aside></div>
    <dialog id="selection-dialog" class="rv-dialog" aria-labelledby="selection-title"><form method="dialog"><button class="rv-dialog-close" aria-label="Cerrar resumen">×</button></form><h2 id="selection-title">Tu selección está lista.</h2><div id="selection-details"></div><form method="dialog"><button class="button button-primary">Seguir explorando ↗</button></form></dialog>
  </template>
</body>
</html>
