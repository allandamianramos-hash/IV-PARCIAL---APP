<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda del Viajero | Rumbo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tienda.css">
  <script src="tienda.js" defer></script>
</head>
<body>
  <main class="store-container">
    <header class="store-header">
      <div class="header-left">
        <!-- Si tu página principal está en otra carpeta, ajusta esta ruta -->
        <a href="index.html" class="back-link">← Volver a Inicio</a>
        <h1>La tienda del viajero</h1>
        <p>Todo lo que necesitas para tu próxima aventura, a precios accesibles.</p>
      </div>

      <button class="cart-btn" id="open-cart-btn" type="button">
        🛒 Ver carrito <span id="cart-count">0</span>
      </button>
    </header>

    <nav class="store-filters" aria-label="Categorías de productos">
      <button class="filter-btn active" type="button" data-category="all">Todos</button>
      <button class="filter-btn" type="button" data-category="Equipaje">Equipaje</button>
      <button class="filter-btn" type="button" data-category="Tecnología">Tecnología</button>
      <button class="filter-btn" type="button" data-category="Confort">Confort</button>
      <button class="filter-btn" type="button" data-category="Seguridad">Seguridad</button>
      <button class="filter-btn" type="button" data-category="Cuidado">Cuidado personal</button>
    </nav>

    <p id="product-count" class="product-count"></p>
    <section class="products-grid" id="products-grid" aria-label="Productos"></section>
  </main>

  <dialog id="cart-modal" class="cart-dialog" aria-labelledby="cart-title">
    <div class="dialog-header">
      <div>
        <span class="dialog-label">TU SELECCIÓN</span>
        <h2 id="cart-title">Mi carrito</h2>
      </div>
      <button id="close-cart-btn" class="close-btn" type="button" aria-label="Cerrar carrito">×</button>
    </div>

    <div id="cart-items" class="cart-items"></div>

    <div class="cart-summary">
      <div class="summary-row">
        <span>Artículos</span>
        <strong id="summary-count">0</strong>
      </div>
      <div class="summary-row">
        <span>Subtotal</span>
        <strong id="cart-subtotal">L. 0.00</strong>
      </div>
      <div class="summary-row total-row">
        <span>Total</span>
        <span id="cart-total">L. 0.00</span>
      </div>
      <button class="checkout-btn" id="checkout-btn" type="button" disabled>
        Confirmar compra
      </button>
      <p class="checkout-note">Compra de demostración: todavía no se realiza ningún cobro.</p>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
